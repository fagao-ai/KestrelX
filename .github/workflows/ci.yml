name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KESTREL_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/kestrel
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kestrel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: bash scripts/check-line-limits.sh
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo check -p kestrel --no-default-features
      - name: Check isolated features
        run: |
          for feature in openai anthropic gemini todo subagent mcp skills; do
            cargo check -p kestrel --no-default-features --features "$feature"
          done
      - run: cc -fsyntax-only -x c -include kestrel-ffi/include/kestrel.h /dev/null
      - run: cargo build -p kestrel-ffi
      - run: PYTHONPATH=bindings/python python3 bindings/python/example.py
      - run: PYTHONPATH=bindings/python python3 bindings/python/example_async.py
      - run: PYTHONPATH=bindings/python python3 bindings/python/example_persistence.py
      - run: PYTHONPATH=bindings/python python3 bindings/python/example_stream_model.py
      - run: PYTHONPATH=bindings/python python3 bindings/python/example_resume.py
      - run: cd bindings/python && python3 -m unittest test_contract.py
      - run: python3 -m pip install build twine
      - run: python3 -m build
      - run: python3 -m twine check dist/*
      - run: test -z "$(gofmt -l bindings/go)"
      - run: cd bindings/go && go vet ./...
      - run: cd bindings/go && go test ./...
      - run: cargo build -p kestrel-node
      - run: cd bindings/node && node --test
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps
