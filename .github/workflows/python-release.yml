name: Python Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index to publish to
        type: choice
        options:
          - build-only
          - testpypi
          - pypi
        default: testpypi
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: python-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*
          if-no-files-found: error

  macos-wheels:
    name: macOS wheel (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            platform: macosx_11_0_arm64
          - runner: macos-15-intel
            arch: x86_64
            platform: macosx_10_9_x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        env:
          KESTREL_WHEEL_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install --upgrade build twine
          python -m build --wheel --outdir wheelhouse
          python -m twine check wheelhouse/*
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/python_smoke_test.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-macos-${{ matrix.arch }}
          path: wheelhouse/*
          if-no-files-found: error

  manylinux-wheel:
    name: Linux wheel (manylinux x86_64)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow container git access
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        env:
          KESTREL_WHEEL_PLATFORM: manylinux_2_28_x86_64
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install --upgrade build twine
          /opt/python/cp312-cp312/bin/python -m build --wheel --outdir wheelhouse
          /opt/python/cp312-cp312/bin/python -m twine check wheelhouse/*
      - name: Audit wheel
        run: auditwheel show wheelhouse/*.whl
      - name: Smoke-test installed wheel
        run: |
          /opt/python/cp312-cp312/bin/python -m pip install --force-reinstall wheelhouse/*.whl
          cd /tmp
          /opt/python/cp312-cp312/bin/python "$GITHUB_WORKSPACE/scripts/python_smoke_test.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-manylinux-x86_64
          path: wheelhouse/*
          if-no-files-found: error

  windows-wheel:
    name: Windows wheel (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        env:
          KESTREL_WHEEL_PLATFORM: win_amd64
        run: |
          python -m pip install --upgrade build twine
          python -m build --wheel --outdir wheelhouse
          python -m twine check wheelhouse/*
      - name: Smoke-test installed wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/scripts/python_smoke_test.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-windows-x64
          path: wheelhouse/*
          if-no-files-found: error

  publish:
    name: Publish Python package
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'build-only'
    needs:
      - sdist
      - macos-wheels
      - manylinux-wheel
      - windows-wheel
    runs-on: ubuntu-latest
    environment:
      name: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
      url: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'https://test.pypi.org/project/kestrelx/' || 'https://pypi.org/project/kestrelx/' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import sys; sys.path.insert(0, "bindings/python"); from kestrelx._version import __version__; print(__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Inspect release files
        run: |
          ls -lh dist
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
