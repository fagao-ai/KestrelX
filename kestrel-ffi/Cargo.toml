[package]
name = "kestrel-ffi"
version = "0.1.0"
edition = "2024"
description = "C ABI for the Kestrel agent core"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
async-trait = "0.1"
kestrel = { path = "..", default-features = false, features = ["anthropic", "gemini", "mcp", "openai", "skills", "subagent", "todo"] }
kestrel-contract = { path = "../kestrel-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
