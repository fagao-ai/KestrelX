[package]
name = "kestrel-node"
version = "0.1.0"
edition = "2024"
description = "Node.js native addon for Kestrel"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
napi = { version = "3", features = ["async", "serde-json", "tokio_rt"] }
napi-derive = "3"
kestrel = { path = "..", features = ["mcp", "skills", "todo"] }
kestrel-contract = { path = "../kestrel-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[build-dependencies]
napi-build = "2"
