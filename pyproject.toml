[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-agent-core"
dynamic = ["version"]
description = "Scenario-agnostic agent core for Python, backed by Rust"
readme = "bindings/python/README.md"
requires-python = ">=3.9"
keywords = ["agents", "llm", "openai", "anthropic", "gemini", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5"]

[tool.setuptools]
package-dir = { "" = "bindings/python" }
packages = ["kestrel_agent_core"]
include-package-data = true

[tool.setuptools.package-data]
kestrel_agent_core = ["py.typed", "_native/*"]

[tool.setuptools.dynamic]
version = { attr = "kestrel_agent_core._version.__version__" }
